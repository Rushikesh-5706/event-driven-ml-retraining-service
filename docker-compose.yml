version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    hostname: rabbitmq_host
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      ml_network:
        aliases:
          - rabbitmq_host

  training_trigger_api:
    build: ./training_trigger_api
    container_name: training_trigger_api
    ports:
      - "5000:5000"
    environment:
      FLASK_APP: app.main
      FLASK_ENV: development
      RABBITMQ_HOST: rabbitmq_host
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./training_trigger_api:/app
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ml_network

  retraining_worker:
    build: ./retraining_worker
    container_name: retraining_worker
    environment:
      RABBITMQ_HOST: rabbitmq_host
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./retraining_worker:/app
      - ./data:/app/data
    networks:
      - ml_network

volumes:
  rabbitmq_data:


networks:
  ml_network:
    driver: bridge
